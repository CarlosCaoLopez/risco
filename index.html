<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Risco</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="desk" aria-hidden="true"><i></i><i></i><i></i></div>

    <main>
      <header class="glass-panel hero">
        <img src="/icon.png" alt="" width="52" height="52" />
        <div>
          <h1>Risco</h1>
          <p id="hint" data-i18n-html="hero.hint"></p>
        </div>
        <label class="switch" data-i18n-title="hero.enabled">
          <input type="checkbox" id="enabled" />
          <span></span>
        </label>
      </header>

      <section class="glass-panel" id="permission" hidden>
        <h2 data-i18n="permission.title"></h2>
        <div class="row">
          <div><strong data-i18n="permission.name"></strong><small data-i18n="permission.body"></small></div>
          <button class="pill" id="open-accessibility" data-i18n="permission.open"></button>
        </div>
      </section>

      <section class="glass-panel">
        <h2 data-i18n="pen.title"></h2>
        <div class="cup" id="cup" role="radiogroup" data-i18n-aria="pen.color"></div>
        <p class="note" data-i18n-html="pen.shortcuts"></p>
        <article class="paper" id="preview">
          <p data-i18n-html="pen.preview"></p>
        </article>
      </section>

      <section class="glass-panel">
        <h2 data-i18n="gesture.title"></h2>
        <div class="segmented" id="modifier" role="radiogroup" data-i18n-aria="gesture.key">
          <button data-value="ctrl" role="radio">Ctrl</button>
          <button data-value="alt" role="radio">Alt</button>
          <button data-value="shift" role="radio" data-i18n="modifier.shift"></button>
          <button data-value="meta" role="radio">Super</button>
        </div>
      </section>

      <section class="glass-panel">
        <h2 data-i18n="effects.title"></h2>
        <div class="row">
          <div><strong data-i18n="effects.animation"></strong><small data-i18n="effects.animation.hint"></small></div>
          <label class="switch"><input type="checkbox" id="animation" /><span></span></label>
        </div>
        <div class="row">
          <div><strong data-i18n="effects.sound"></strong><small data-i18n="effects.sound.hint"></small></div>
          <label class="switch"><input type="checkbox" id="sound" /><span></span></label>
        </div>
        <div class="row" id="volume-row">
          <input type="range" id="volume" min="0" max="1" step="0.05" data-i18n-aria="effects.volume" />
          <button class="pill" id="test-sound" data-i18n="effects.test"></button>
        </div>
      </section>

      <section class="glass-panel">
        <h2 data-i18n="viewers.title"></h2>
        <p class="note" data-i18n-html="viewers.note"></p>
        <ul class="list" id="viewers"></ul>
        <div class="row">
          <div><strong data-i18n="migrate.title"></strong><small data-i18n-html="migrate.hint"></small></div>
          <button class="pill" id="migrate" data-i18n="migrate.button"></button>
        </div>
      </section>

      <section class="glass-panel">
        <h2 data-i18n="roots.title"></h2>
        <ul class="list" id="roots"></ul>
        <button class="pill" id="add-root" data-i18n="roots.add"></button>
      </section>

      <section class="glass-panel">
        <div class="row">
          <div><strong data-i18n="autostart.title"></strong><small data-i18n="autostart.hint"></small></div>
          <label class="switch"><input type="checkbox" id="autostart" /><span></span></label>
        </div>
        <div class="row">
          <div><strong data-i18n="language.title"></strong></div>
          <select class="pill" id="language" data-i18n-aria="language.title"></select>
        </div>
      </section>
    </main>

    <div class="toast glass-capsule" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
