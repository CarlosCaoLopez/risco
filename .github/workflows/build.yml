# Compiles the frontend, both viewer plugins and the Rust workspace on every
# push and pull request, so a broken build is caught before release time.
name: Build

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Frontend and plugins
        run: npm run build

      - name: Rust workspace
        run: cargo build --workspace --locked
